<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Generate random death metal riffs for two guitars, hear them and read the tab." />
    <title>Riff Generator</title>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Riff Generator</h1>
        <p>Random death metal riffs for two guitars. Pick a key, scale and tempo, then generate.</p>
      </header>

      <main>
        <section class="panel" aria-label="Riff settings">
          <div class="fields fields-grid">
            <label class="field"><span class="field-label">Key</span><select id="key"></select></label>
            <label class="field field-wide"><span class="field-label">Scale</span><select id="scale"></select></label>
            <label class="field"><span class="field-label">Bars</span><select id="bars"></select></label>
            <label class="field"><span class="field-label">Style</span><select id="style"></select></label>
            <label class="field field-wide"><span class="field-label">Guitar 2</span><select id="guitar2"></select></label>
            <label class="field"><span class="field-label">Complexity</span><select id="complexity"></select></label>
            <div class="field">
              <span class="field-label" id="chromatic-label">Passing notes</span>
              <label class="switch" title="Let runs step by semitones, outside the chosen scale">
                <input id="chromatic" type="checkbox" aria-describedby="chromatic-label" /><span>Chromatic</span>
              </label>
            </div>
          </div>

          <div class="fields">
            <div class="field field-bpm">
              <label class="field-label" for="bpm-number">BPM</label>
              <div class="bpm-row">
                <input id="bpm-range" type="range" min="60" max="260" step="1" aria-label="BPM slider" />
                <input id="bpm-number" type="number" min="60" max="260" step="1" inputmode="numeric" />
              </div>
            </div>
            <div class="field field-seed">
              <label class="field-label" for="seed">Seed</label>
              <div class="seed-row">
                <input id="seed" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="seed-error" />
                <button id="copy-seed" type="button" class="btn btn-ghost btn-small">Copy</button>
              </div>
              <span id="seed-error" class="field-error" role="alert"></span>
            </div>
          </div>

          <div class="actions">
            <button id="generate" type="button" class="btn btn-primary">Generate</button>
            <button id="play" type="button" class="btn btn-play"><span class="play-icon" aria-hidden="true"></span><span class="play-label">Play</span></button>
            <label class="switch"><input id="loop" type="checkbox" checked /><span>Loop</span></label>
            <label class="switch"><input id="countin" type="checkbox" /><span>Count-in</span></label>
            <div class="beats" id="beats" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <span id="position" class="position"></span>
          </div>
        </section>

        <section class="panel mixer" aria-label="Mixer">
          <div class="channel" data-guitar="guitar1">
            <span class="channel-name">Guitar 1 <small>left</small></span>
            <button type="button" class="toggle" data-action="mute" aria-pressed="false">Mute</button>
            <button type="button" class="toggle" data-action="solo" aria-pressed="false">Solo</button>
            <input type="range" min="-24" max="6" step="1" value="0" data-action="volume" aria-label="Guitar 1 volume" />
          </div>
          <div class="channel" data-guitar="guitar2">
            <span class="channel-name">Guitar 2 <small>right</small></span>
            <button type="button" class="toggle" data-action="mute" aria-pressed="false">Mute</button>
            <button type="button" class="toggle" data-action="solo" aria-pressed="false">Solo</button>
            <input type="range" min="-24" max="6" step="1" value="0" data-action="volume" aria-label="Guitar 2 volume" />
          </div>
          <div class="channel" data-guitar="drums">
            <span class="channel-name">Drums <small>center</small></span>
            <button type="button" class="toggle" data-action="mute" aria-pressed="false">Mute</button>
            <button type="button" class="toggle" data-action="solo" aria-pressed="false">Solo</button>
            <input type="range" min="-24" max="6" step="1" value="0" data-action="volume" aria-label="Drums volume" />
          </div>
        </section>

        <section class="panel tab-panel" aria-labelledby="tab-heading">
          <div class="tab-head">
            <h2 id="tab-heading">Tablature</h2>
            <p id="summary" class="summary" aria-live="polite"></p>
            <div class="tab-actions">
              <button id="copy-link" type="button" class="btn btn-ghost btn-small">Copy link</button>
              <button id="download-midi" type="button" class="btn btn-ghost btn-small">Download MIDI</button>
            </div>
          </div>
          <div id="tab" class="tab"></div>
        </section>
      </main>

      <footer class="hint">
        <kbd>Space</kbd> play / stop <span aria-hidden="true">·</span> <kbd>G</kbd> generate
        <span aria-hidden="true">·</span> <kbd>L</kbd> loop
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
