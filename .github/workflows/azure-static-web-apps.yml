# Builds, tests and deploys the app to Azure Static Web Apps (readme §6.18).
#
# Setup (once): create the Static Web App with deployment source "Other" (so Azure doesn't add its
# own workflow), copy its deployment token, and save it in this GitHub repository as the secret
# AZURE_STATIC_WEB_APPS_API_TOKEN.
#
# - Push to main: test, build, deploy to production.
# - Pull request: test, build, deploy to a preview URL (posted on the PR); removed when the PR closes.
name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write # lets the deploy action comment the preview URL on the PR

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # v5 runs on Node 24 (v4 targeted the deprecated Node 20 runtime).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same major version the project is developed and tested on (LTS).
          node-version: 26
          cache: npm

      - run: npm ci

      # A failing test stops the deploy.
      - run: npm test

      # Type-checks, then builds into dist/ (staticwebapp.config.json is copied from public/).
      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Upload the build we just tested; don't let Azure rebuild with its own Node version.
          app_location: dist
          output_location: ''
          skip_app_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the pull request's preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: dist
